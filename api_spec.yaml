  /online_order_status:
    get:
      tags:
      - Online orders
      description: The request to get the order status should include the order reference ID as a path parameter.
      operationId: Get order status
      responses:
        '200':
          description: A list of order statuses
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_status:
                    type: array
                    description: List of order statuses
                    items:
                      type: object
                      properties:
                        system_unique_id:
                          type: string
                          description: System-generated unique identifier for the order.
                          example: string
                        order_reference_id:
                          type: string
                          description: A unique identifier for the order reference id.
                          example: string
                        order_reference_number:
                          type: string
                          description: A unique identifier for the order reference number.
                          example: string
                        order_status:
                          type: string
                          description: Status code of the order.
                          example: '0'
                        status_name:
                          type: string
                          description: Name of the order status.
                          example: Pending
                  cursor:
                    type: string
                    description: Cursor for pagination to fetch the next set of results.
                    example: MT@sMT@=
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Error message
                        example: Invalid request parameters
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                system_unique_ids:
                  type: string
                  description: Comma-separated list of system unique IDs to filter the orders
                created_at_min:
                  type: string
                  format: date-time
                  description: Minimum created date (Y-m-d H:i:s) 24 hours format
                created_at_max:
                  type: string
                  format: date-time
                  description: Maximum created date (Y-m-d H:i:s) 24 hours format
                limit:
                  type: integer
                  default: 10
                  description: Limit the number of results (optional)
                cursor:
                  type: string
                  description: Cursor for pagination (optional)
  /cancel_online_order:
    post:
      tags:
      - Online orders
      summary: Cancel an online order
      description: This API allows cancelling an existing order using the system unique ID.
      operationId: CancelOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                system_unique_id:
                  type: string
                  description: The unique system identifier of the order to be cancelled.
              required:
              - system_unique_id
      responses:
        '200':
          description: Order cancellation successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Status indicating success.
                      details:
                        type: string
                        description: Detailed message about the cancellation result.
                      order_reference_id:
                        type: string
                        description: Reference ID of the cancelled order.
                      order_reference_number:
                        type: string
                        description: Reference number of the cancelled order.
        '400':
          description: Order cancellation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Status indicating failure.
                      details:
                        type: string
                        description: Detailed message about the error.
  /shifts:
    get:
      tags:
      - Shifts
      description: This API will allow get the list of shifts from SalesPlay POS.
      operationId: Get list of shifts
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  shifts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique identifier of the shift
                        pos_device_id:
                          type: string
                          description: POS device ID
                        opened_at:
                          type: string
                          format: date-time
                          description: Shift opened date and time
                        closed_at:
                          type: string
                          format: date-time
                          description: Shift closed date and time
                        opened_by_employee:
                          type: string
                          description: Employee ID who opened the shift
                        closed_by_employee:
                          type: string
                          description: Employee ID who closed the shift
                        starting_cash:
                          type: number
                          description: The initial money amount at the start of the shift
                        cash_payments:
                          type: number
                          description: The total money amount of cash payments for the shift
                        cash_refunds:
                          type: number
                          description: The total money amount of cash refunds for the shift
                        paid_in:
                          type: number
                          description: The money amount added to the cash drawer
                        paid_out:
                          type: number
                          description: The money amount removed from the cash drawer (always positive)
                        expected_cash:
                          type: number
                          description: The expected money amount at the end of the shift
                        actual_cash:
                          type: number
                          description: The actual money amount at the end of the shift
                        gross_sales:
                          type: number
                          description: |
                            The gross money amount for the shift. Calculated as sum of all payments before discounts but after INCLUDED taxes
                        refunds:
                          type: number
                          description: The total money amount of refunds for the shift
                        discounts:
                          type: number
                          description: The total money amount of discounts for the shift (always positive)
                        net_sales:
                          type: number
                          description: Gross sales minus discounts and refunds
                        tip:
                          type: number
                          description: The total money amount of tips for the shift
                        surcharge:
                          type: number
                          description: The total money amount of surcharge for the shift
                        taxes:
                          type: array
                          description: The list of taxes and it's totals for the shift
                          items:
                            type: object
                            properties:
                              tax_id:
                                type: string
                              money_amount:
                                type: number
                                format: float
                                description: The total money amount for the tax in the shift
                        payments:
                          type: array
                          description: The list of total money amounts for every payment type in the shift
                          items:
                            type: object
                            properties:
                              payment_type_id:
                                type: string
                              money_amount:
                                type: number
                                format: float
                                description: The total money amount for the payment type
                        cash_movements:
                          type: array
                          description: The list of shift cash movements
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                example: PAY_IN
                                description: The type of cash movement
                              money_amount:
                                type: number
                                format: float
                                description: The money amount. The value is always positive.
                              comment:
                                type: string
                                description: The description of the cash movement
                              employee_id:
                                type: string
                                description: The employee id who made the cash movement
                              created_at:
                                type: string
                                format: date-time
                                description: The time when this cash movement was created
                        shop_id:
                          type: string
                          description: Shop ID
                        shift_id:
                          type: string
                          description: Shift ID
                  cursor:
                    type: string
                    description: Cursor for pagination
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                shift_ids:
                  type: string
                  description: Comma-separated list of shift IDs
                pos_device_ids:
                  type: string
                  description: List of pos device keys (comma-separated)
                created_at_min:
                  type: string
                  format: date-time
                  description: Minimum creation date (Y-m-d H:i:s) 24 hours format
                created_at_max:
                  type: string
                  format: date-time
                  description: Maximum creation date (Y-m-d H:i:s) 24 hours format
                limit:
                  type: integer
                  default: 10
                  description: Number of shifts to return
                cursor:
                  type: string
                  description: Cursor for pagination
