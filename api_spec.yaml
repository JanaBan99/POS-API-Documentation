servers:
- description: live url
  url: https://api.salesplaypos.com/v1.0/
info:
  version: '1.0'
  title: SalesPlay API
  description: |
    # Using the REST API

      SalesPlay API follows the general REST API patterns developed with secure connections. HTTPS requests to the URLs. Endpoints are mentioned below.

      To begin testing SalesPlay APIs with Postman, follow these instructions:

      1.  Install and download Postman. Here is where to obtain it: [https://www.getpostman.com](https://www.getpostman.com )

      2.  Get [SalesPlay API Postman Collection](https://developer.salesplay.com/download_postman_collection.php) and import it into Postman.

      3.  Define variables used in the Postman collection. For example, in the SalesPlay production environment for SalesPlay API v1.0, you should define the following variables in your Postman environment:

          1. baseUrl : Set this to [https://api.salesplaypos.com/v1.0]()

          2. Token : Obtain this from the SalesPlay Backoffice

          To get your access token:

          1. Log in to the SalesPlay Backoffice at [https://cloud.salesplaypos.com/](https://cloud.salesplaypos.com/)

          2. Navigate to the Access token page under Integrations.

          3. Generate and copy your access token.

      Configuring these variables in Postman environments is useful as it allows you to reuse them across multiple requests without manual redefinition. This approach streamlines your API testing process and makes it easier to switch between different environments (e.g., production, staging, development).

      Remember to keep your access token secure and never share it publicly.

    # Versioning

      The SalesPlay API uses versioning. This documentation is for version 1.0 of the API. Version must be specified in the base URL, for example: [https://api.salesplaypos.com/v1.0]()

    # Authorization

      An application credential is any piece of information that identifies, authenticates, or authorizes an application in some way.

      SalesPlay API provide following authorization methods:

      - Personal access tokens
      - OAuth 2.0

    ## Personal access tokens

      Personal access tokens provide a simple and secure way to authenticate API calls. This authorization method is ideal for scenarios such as running periodic scripts that interact with data in your own account.

      To obtain your personal access token:

      1. Log in to the SalesPlay Backoffice at [https://cloud.salesplaypos.com/](https://cloud.salesplaypos.com/)

      2. Navigate to the Access token page under Integrations

      3. Generate and copy your access token

      For every API call, you must include your access token in the Authorization header. The header should be structured as follows:

      ```plaintext
      {
          Token : Bearer YOUR_ACCESS_TOKEN
      }
      ```
      Replace YOUR_ACCESS_TOKEN with the actual token you obtained from the SalesPlay Backoffice.

      Remember to keep your access token confidential and never share it publicly. If you suspect your token has been compromised, regenerate it immediately in the SalesPlay Backoffice.

      By using your personal access token correctly in the Authorization header, you can securely authenticate your requests to the SalesPlay API.

    ## OAuth 2.0

      The main steps of OAuth flow are:

      1. Log in to the SalesPlay Backoffice at [https://cloud.salesplaypos.com/](https://cloud.salesplaypos.com/)

      2. Navigate to the OAuth 2.0 setup page under Integrations and create a new app by providing the necessary details, such as the app name, and selecting the permissions required by your app. You can find the full list of available permissions on that page.

      3. After successfully creating your app you will be given a set of 3 unique keys **App ID, App secret** and **Authorization Code** which are used to identify your app and are required to complete the authorization process.

      4. Once you have the authorization code, your app can now request an access token by sending a request to the following Access Token URL:

      ```plaintext
         https://api.salesplaypos.com/v1.0/oauth/token
      ```
      - The payload of your request must be with Content-Type: application/x-www-form-urlencoded and include:

        - client_id: The App id provided when creating your app.
        - client_secret: The App secret provided when creating your app.
        - grant_type: authorization_code
        - code:  The Authorization Code provided when creating your app.

        In case of successful request you will get a response with an access token. Response example:

      ```plaintext
          {
            "access_token": "d6a4a1ceb2b6738352ddc945a676c5cf37d8ca4e",
            "expires_in": 3600,
            "token_type": "Bearer",
            "scope": "OptNZG",
            "refresh_token": "b54f8bc7235272c569c1ec25684a430c5d94050b"
          }
      ```
      Once you receive an access token you can use it to interact with the SalesPlay API on behalf of the merchant by providing the access token in an Authorization header.

    ### Refreshing access token

      When the access token expires you can obtain a new one by making POST request to ``` https://api.salesplaypos.com/v1.0/oauth/token ``` with the following parameters:

      - client_id
      - client_secret
      - refresh_token
      - grant_type (specify "refresh_token")

    # Pagination

      Some API endpoints paginate their responses to make the result set easier to handle. For example, if you request a list of items that is potentially too large to handle efficiently, the endpoint will return the first batch of results along with a marker of some kind to access the next batch of results. You may be able to avoid dealing with pagination by narrowing your initial request.

      Paginated results include a cursor field as part of the response body. To fetch the next set of results, send a followup request to the same endpoint and provide the cursor value returned in the previous response as a query parameter. When the endpoint sends the final set of results, the response body will not include a cursor field.

      It is possible to change the number of objects returned in the response. It can be done by passing the limit parameter. Default value is 10 and maximum is 250.

      # API rate limits
      The SalesPlay API platform applies rate limits to the API requests that it receives. Every request is subject to throttling under our general limits. There are additional resource-based rate limits. Your app should be prepared to implement retry behavior if it is throttled. The current limit is 300 requests per 300 sec per account. All requests that are made after rate limits have been exceeded are throttled and an HTTP **429 Too Many Requests** error is returned.


    # Date and time format

      All dates and times in the API are in 24 hours format. In requests you should specify dates and times in 24 hours format. When processing responses you should convert dates and times to your local time.

    # Handling errors

      The API will return an Error List for a failed request, which will contain one or more Error objects.

      ```plaintext
          {
              "errors": {
                  "code": "UNAUTHORIZED",
                  "details": "Access token is not valid."
              }
          }
      ```

      The SalesPlay API uses the following error codes:

      | Error code | Description |
      | ------ | ------ |
      | 401 UNAUTHORIZED | An authentication error. Request had a missing, malformed, or invalid authorization data |

    # Webhooks overview

      Real-time notifications for various SalesPlay system events are most effectively delivered through webhooks. While periodic polling of specific endpoints can maintain synchronization with SalesPlay updates, webhooks provide a more efficient solution for this requirement.

      Supported webhook events:

      | Event | Description |
      | ------ | ------ |
      | inventory_levels.update | Webhook is fired when a item’s inventory is updated. |
      | Products.update | Webhook is fired when an product is created, updated or deleted. |
      | customers.update | Webhook is fired when a customer is created, updated or deleted. |
      | receipts.update | Webhook is fired when a receipt is created or updated. |
      | credit_note.update | Webhook is fired when a credit note or cash refund is created or updated. |

      Upon event occurrence, SalesPlay gathers the relevant event data, generates a notification, and transmits it via POST request to the notification URL that was registered during webhook configuration.

    ## Adding webhook

     There are two ways to configure webhooks:

     - Using /webhook endpoint
     - Using web interface which can be accessed on [https://cloud.salesplaypos.com/webhooks_setup](https://cloud.salesplaypos.com/webhooks_setup)

     Each webhook subscription is limited to a single event type. The pairing of event type and URL must remain unique across all webhook configurations. The designated URL must follow proper formatting standards, utilize HTTP or HTTPS protocol, and maintain accessibility for successful webhook delivery.

     ## Webhook payload

      After webhook creation, SalesPlay will dispatch an HTTP POST request to the configured URL whenever the subscribed event triggers. Each POST request includes JSON data containing details about the object that initiated the event, along with HTTP headers that provide contextual information.

      Payload example for `inventory_levels.update` event type:

      ```plaintext
          {
            "merchant_id": "WFpYWmQwMkJGVWtDT3RHY1NHYjdBT0YzZE5xOD0=",
            "type": "inventory_levels.update",
            "created_at": "2025-06-30 12:54:31",
            "inventory_levels": [
              {
                "product_id": "QWhxek54UkQ3eTArdml2d1NkSDVnUT09",
                "shop_id": "bHF2M2pMakkzTVZ0NFh2SE1WNnNoUT09",
                "product_code": "10003",
                "in_stock": 10
              }
            ]
          }
      ```

    ## Testing webhook
     When creating webhooks through the web interface, you can validate your configuration by triggering a test notification. SalesPlay will dispatch a test POST request containing sample data to your specified URL. For webhook testing purposes, you can either run your own server or utilize external services like Beeceptor.

    ## Request timeout and retries
     Upon receiving webhook requests, your endpoint must return a 2xx HTTP status code. Any response code outside the 2xx range will be treated as a delivery failure by SalesPlay. The system does not process redirects for webhook notifications and classifies them as error responses. Following delivery failures, SalesPlay will attempt to resend the request up to 200 times within a 48-hour window. If no 2xx response is received during this period, the webhook status will automatically change to "Disabled".
paths:
  /webhooks:
    get:
      tags:
      - Webhooks
      description: Retrieve one webhook by `id`, or every webhook registered on the account when no `id` is sent (the response
        is then a JSON array of the same objects).
      operationId: Get a single of webhook
      responses:
        '200':
          description: Webhook details fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier of the webhook
                  merchant_id:
                    type: string
                    description: Encrypted merchant ID
                  url:
                    type: string
                    format: uri
                    description: Registered webhook URL
                  type:
                    type: string
                    description: Webhook event type
                  status:
                    type: string
                    description: 'Webhook status: `ENABLED` or `DISABLED`'
                  created_at:
                    type: string
                    format: date-time
                    description: The creation date of the webhook (Y-m-d H:i:s) 24 hours format
                  updated_at:
                    type: string
                    format: date-time
                    description: The last updated date of the webhook (Y-m-d H:i:s) 24 hours format
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: The unique identifier of the webhook to retrieve. Omit it to receive an array of every webhook
                    on the account.
    post:
      tags:
      - Webhooks
      description: This API will allow create webhook from SalesPlay POS.
      operationId: Create a single webhook
      responses:
        '200':
          description: Webhook registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier of the webhook
                  merchant_id:
                    type: string
                    description: Encrypted merchant ID
                  url:
                    type: string
                    format: uri
                    description: Registered webhook URL
                  type:
                    type: string
                    description: Webhook event type
                  status:
                    type: string
                    description: 'Webhook status: `ENABLED` or `DISABLED`'
                  created_at:
                    type: string
                    format: date-time
                    description: The creation date of the webhook (Y-m-d H:i:s) 24 hours format
                  updated_at:
                    type: string
                    format: date-time
                    description: The last updated date of the webhook (Y-m-d H:i:s) 24 hours format
                example:
                  id: RDYzUXdTT21zRkw4TWY4Nk5sUW5xQT09
                  merchant_id: NDRnNnhWRGpXSWxsQmtiVkhiQ0M4SlJNM1NvaXRiajJlQXJsc3JXVG1tOD0=
                  url: https://example.com/webhooks/salesplay
                  type: receipts.update
                  status: DISABLED
                  created_at: '2026-09-14 15:19:46'
                  updated_at: '2026-09-14 15:19:46'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  description: The URL to which webhook data will be sent.
                type:
                  type: string
                  enum:
                  - receipts.update
                  description: The event to subscribe to. See the Webhooks overview for the list of events.
                status:
                  type: string
                  enum:
                  - ENABLED
                  - DISABLED
                  description: Status of the webhook.
                master_username:
                  type: string
                  format: email
                  description: Master account username for the merchant.
              required:
              - url
              - type
              - status
              - master_username
    delete:
      tags:
      - Webhooks
      description: This API deletes a specific webhook from SalesPlay POS using its ID.
      operationId: Delete a single webhook
      responses:
        '200':
          description: Webhook deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_object_ids:
                    type: string
                    description: ID of the deleted webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: The unique identifier of the webhook to delete.
              required:
              - id
  /category:
    get:
      tags:
      - Categories
      description: This API will allow get the list of categories from SalesPlay POS.
      operationId: Get a list of categories
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The unique identifier for the category
                        category_name:
                          type: string
                          description: The name of the category
                        item_classification_code:
                          type: string
                          description: The item classification code of the category
                        created_at:
                          type: string
                          format: date-time
                          description: The creation date of the category (Y-m-d H:i:s) 24 hours format
                        updated_date:
                          type: string
                          format: date-time
                          description: The last updated date of the category (Y-m-d H:i:s) 24 hours format
                  cursor: &id001
                    type: string
                    description: Pagination cursor. Send it back in the next request to fetch the following page; absent on
                      the last page.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                category_ids:
                  type: string
                  description: Return only categories specified by a comma-separated list of IDs
                created_at_min:
                  type: string
                  format: date-time
                  description: Minimum create date (Y-m-d H:i:s) 24 hours format
                created_at_max:
                  type: string
                  format: date-time
                  description: Maximum create date (Y-m-d H:i:s) 24 hours format
                limit:
                  type: integer
                  default: 10
                  description: Number of categories to return
                cursor:
                  type: string
                  description: Cursor for pagination
    post:
      tags:
      - Categories
      description: This API will allow create categories from SalesPlay POS.
      operationId: Create or update a single category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_name:
                  type: string
                  description: The name of the category
                item_classification_code:
                  type: string
                  description: The item classification code of the category
                created_at:
                  type: string
                  format: date-time
                  description: The creation date of the category (Y-m-d H:i:s) 24 hours format
              required:
              - category_name
              - created_at
      responses:
        '200':
          description: Category created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The unique identifier for the category
                  name:
                    type: string
                    description: The name of the category
                  item_classification_code:
                    type: string
                    description: The item classification code of the category
                  created_at:
                    type: string
                    format: date-time
                    description: The creation date of the category (Y-m-d H:i:s) 24 hours format
    delete:
      tags:
      - Categories
      description: This API will delete a category from SalesPlay POS.
      operationId: Delete a single category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: string
                  description: The unique identifier for the category to delete
              required:
              - category_id
      responses:
        '200':
          description: Category deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: object
                    properties:
                      code:
                        type: string
                        description: 200
                      details:
                        type: string
                        description: Category deleted successfully
                      category_id:
                        type: string
                        description: The deleted category ID
  /sub_category:
    get:
      tags:
      - Sub categories
      description: This API will allow get the list of sub categories from SalesPlay POS.
      operationId: Get a list of sub categories
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  cursor:
                    type: string
                    description: Cursor for pagination
                  sub_categories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The unique identifier for the subcategory
                        category_name:
                          type: string
                          description: The name of the category
                        sub_category_name:
                          type: string
                          description: The name of the subcategory
                        created_at:
                          type: string
                          format: date-time
                          description: The creation date of the subcategory (Y-m-d H:i:s) 24 hours format
                        updated_date:
                          type: string
                          format: date-time
                          description: The last updated date of the subcategory (Y-m-d H:i:s) 24 hours format
                example:
                  sub_categories:
                  - id: cFlMNG5WaEIwcHJVWitteURyOHNNZz09
                    category_name: Beverages
                    sub_category_name: Juices
                    created_at: '2026-09-14 12:00:00'
                    updated_date: '2026-09-14 15:17:26'
                  cursor: MT@sMT@=
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sub_category_ids:
                  type: string
                  description: Filter by subcategory IDs
                created_at_min:
                  type: string
                  format: date-time
                  description: Minimum create date (Y-m-d H:i:s) 24 hours format
                created_at_max:
                  type: string
                  format: date-time
                  description: Maximum create date (Y-m-d H:i:s) 24 hours format
                limit:
                  type: integer
                  default: 10
                  description: Number of subcategories to return
                cursor:
                  type: string
                  description: Cursor for pagination
    post:
      tags:
      - Sub categories
      description: This API will allow to create sub categories from SalesPlay POS.
      operationId: Create or update a single sub category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: string
                  description: The ID of the parent category
                sub_category_name:
                  type: string
                  description: The name of the subcategory
                created_at:
                  type: string
                  format: date-time
                  description: The creation date of the subcategory (Y-m-d H:i:s) 24 hours format
              required:
              - category_id
              - sub_category_name
              - created_at
      responses:
        '200':
          description: Subcategory created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The unique identifier for the subcategory
                  category_name:
                    type: string
                    description: The name of the parent category
                  sub_category_name:
                    type: string
                    description: The name of the subcategory
                  created_at:
                    type: string
                    format: date-time
                    description: The creation date of the subcategory (Y-m-d H:i:s) 24 hours format
    delete:
      tags:
      - Sub categories
      description: This API will delete a sub category from SalesPlay POS.
      operationId: Delete a single sub category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: string
                  description: The ID of the parent category
                sub_category_id:
                  type: string
                  description: The ID of the sub category
              required:
              - category_id
              - sub_category_id
      responses:
        '200':
          description: Sub Category deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: object
                    properties:
                      code:
                        type: string
                        example: SUCCESS
                        description: 200
                      details:
                        type: string
                        example: Sub Category successfully deleted.
                        description: Sub Category successfully deleted.
  /measurements:
    get:
      tags:
      - Measurements
      description: This API will allow get the list of measurements from SalesPlay POS.
      operationId: Get a list of measurements
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  measurements:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The unique identifier for the measurement
                        measurement_name:
                          type: string
                          description: The name of the measurement
                        weight_scale_enable:
                          type: string
                          description: Indicates if weight scale is enabled
                        created_at:
                          type: string
                          format: date-time
                          description: The creation date of the measurement (Y-m-d H:i:s) 24 hours format
                        updated_date:
                          type: string
                          format: date-time
                          description: The last updated date of the measurement (Y-m-d H:i:s) 24 hours format
                  cursor:
                    type: string
                    description: Cursor for pagination
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                measurement_ids:
                  type: string
                  description: Filter by measurement IDs
                created_at_min:
                  type: string
                  format: date-time
                  description: Minimum creation date (Y-m-d H:i:s) 24 hours format
                created_at_max:
                  type: string
                  format: date-time
                  description: Maximum creation date (Y-m-d H:i:s) 24 hours format
                limit:
                  type: integer
                  default: 10
                  description: Number of measurements to return
                cursor:
                  type: string
                  description: Cursor for pagination
    post:
      tags:
      - Measurements
      description: This API will allow to create measurements from SalesPlay POS.
      operationId: Create or update a single measurements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                measurement_name:
                  type: string
                  description: The name of the measurement
                weight_scale_enable:
                  type: integer
                  description: Indicates if weight scale is enabled (0 for disabled, 1 for enabled)
                created_at:
                  type: string
                  format: date-time
                  description: The creation date of the measurement (Y-m-d H:i:s) 24 hours format
              required:
              - measurement_name
              - weight_scale_enable
              - created_at
      responses:
        '200':
          description: Measurement created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The unique identifier for the measurement
                  measurement_name:
                    type: string
                    description: The name of the measurement
                  weight_scale_enable:
                    type: string
                    description: Indicates if weight scale is enabled
                  created_at:
                    type: string
                    format: date-time
                    description: The creation date of the measurement (Y-m-d H:i:s) 24 hours format
                  updated_at:
                    type: string
                    format: date-time
                    description: The last updated date of the measurement (Y-m-d H:i:s) 24 hours format
    delete:
      tags:
      - Measurements
      description: This API will delete a measurement from SalesPlay POS.
      operationId: Delete a single measurement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                measurement_id:
                  type: string
                  description: The measurement ID to delete
              required:
              - measurement_id
      responses:
        '200':
          description: Measurement deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: object
                    properties:
                      code:
                        type: string
                        example: SUCCESS
                        description: SUCCESS
                      details:
                        type: string
                        example: Measurement deleted successfully.
                        description: Measurement deleted successfully.
  /taxes:
    get:
      tags:
      - Taxes
      description: This API will allow get the list of taxes from SalesPlay POS.
      operationId: Get a list of taxes
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  taxes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The unique identifier for the tax
                        tax_type:
                          type: string
                          description: Type of tax
                        tax_code:
                          type: string
                          description: Tax code
                        tax_name:
                          type: string
                          description: Name of the tax
                        rate:
                          type: string
                          description: Tax rate
                        shops:
                          type: array
                          items:
                            type: string
                          description: List of shops associated with the tax
                        created_at:
                          type: string
                          format: date-time
                          description: The creation date of the tax (Y-m-d H:i:s) 24 hours format
                        calculation_method:
                          type: string
                          description: 'How the tax is applied: `ADDED` on top of the price or `INCLUDED` in it'
                        apply_tax_after_other_taxes:
                          type: integer
                          description: 1 if this tax is calculated after other taxes
                        is_tax_price_change:
                          type: integer
                          description: 1 if the tax changes the displayed price
