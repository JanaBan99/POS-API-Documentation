    post:
      tags:
      - Receipts
      description: This API allows creating new credit notes (cash refunds) from SalesPlay POS.
      operationId: Create credit note and cash refund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                receipt_number:
                  type: string
                  description: The receipt number (invoice number).
                shop_id:
                  type: string
                  description: The ID of the shop.
                pos_device_id:
                  type: string
                  description: The ID of the pos key (treminal key).
                receipt_type:
                  type: string
                  enum:
                  - CASH_REFUND
                  - CREDIT_NOTE
                  description: Type of the receipt.
                transaction_date:
                  type: string
                  format: date-time
                  description: Date and time of the transaction (YYYY-MM-DD HH:MM:SS).
                line_products:
                  type: array
                  description: List of product line items for the credit note.
                  items:
                    type: object
                    properties:
                      product_id:
                        type: string
                        description: The ID of the product.
                      product_line_no:
                        type: string
                        description: Line number of the product in the original receipt.
                      quantity:
                        type: string
                        description: Quantity being refunded.
                      comment:
                        type: string
                        description: Optional comment for the line item.
                    required:
                    - product_id
                    - product_line_no
                    - quantity
              required:
              - receipt_number
              - shop_id
              - pos_device_id
              - receipt_type
              - transaction_date
              - line_products
      responses:
        '200':
          description: Credit note successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Response code indicating success.
                      details:
                        type: string
                        description: Description of the result.
                      reference_number:
                        type: string
                        description: Unique reference number for the created credit note.
        '400':
          description: Invalid input or missing required fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Error code.
                      details:
                        type: string
                        description: Error message describing the issue.
                      field:
                        type: string
                        description: Field name where validation failed.
