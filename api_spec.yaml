                        payment_type_code:
                          type: string
                          description: Code of the payment method used for the GRN.
                        payment_type_name:
                          type: string
                          description: Name of the payment method used for the GRN.
                        additional_information:
                          type: string
                          description: Additional information or comments about the GRN.
                        items:
                          type: array
                          items:
                            type: object
