  /purchase_orders:
    get:
      tags:
      - Purchase Orders
      description: This API will allow getting the list of purchase orders (GRN) from SalesPlay POS.
      operationId: Get a list of purchase orders
      responses:
        '200':
          description: Successful response - list of purchase orders retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchase_orders:
                    type: array
                    description: Array of purchase order objects
                    items:
                      type: object
                      properties:
                        po_id:
                          type: string
                          description: Encrypted unique identifier for the purchase order
                        shop_id:
                          type: string
                          description: Encrypted shop/location identifier
                        supplier_id:
                          type: string
                          description: Encrypted supplier identifier
                        supplier_code:
                          type: string
                          description: Supplier code
                        supplier_name:
                          type: string
                          description: Name of the supplier
                        po_number:
                          type: string
                          description: Purchase order number
                        po_amount:
                          type: number
                          format: double
                          description: Total purchase order amount
                        po_date:
                          type: string
                          format: date
                          description: Purchase order creation date (YYYY-MM-DD)
                        expected_date:
                          type: string
                          format: date
                          description: Expected delivery date (YYYY-MM-DD)
                        po_status:
                          type: string
                          description: Current status of the purchase order
                          enum:
                          - TEMPORARY_SAVED
                          - PENDING
                          - PARTIALLY_GRN
                          - COMPLETED
                          - CLOSED
                        payment_type_id:
                          type: string
                          description: Encrypted payment method identifier
                        payment_type_code:
                          type: string
                          description: Payment method code (unencrypted)
                        payment_type_name:
                          type: string
                          description: Payment method name
                        additional_information:
                          type: string
                          description: Additional comments or notes for the purchase order
                        items:
                          type: array
                          description: Array of items included in the purchase order
                          items:
                            type: object
                            properties:
                              product_id:
                                type: string
                                description: Encrypted product identifier
                              product_code:
                                type: string
                                description: Product code
                              product_name:
                                type: string
                                description: Name of the product
                              measurement:
                                type: string
                                description: Unit of measurement
                              po_qty:
                                type: number
                                format: double
                                description: Quantity ordered in the purchase order
                              unit_cost:
                                type: number
                                format: double
                                description: Cost per unit
                              total_unit_cost:
                                type: number
                                format: double
                                description: Total cost for the line item
                        additional_cost:
                          type: array
                          description: Additional costs associated with the purchase order
                          items:
                            type: object
                            properties:
                              cost_name:
                                type: string
                                description: Name of the additional cost
                              cost_amount:
                                type: number
                                format: double
                                description: Amount of the additional cost
                  cursor:
                    type: string
                    description: Cursor for pagination to retrieve the next set of results.
        '400':
          description: Bad request - invalid parameters or cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - INVALID_VALUE
                        - INVALID_CURSOR
                        description: Error code indicating the type of validation error
                      details:
                        type: string
                        description: Detailed error message
                      field:
                        type: string
                        description: The field name that caused the error (if applicable)
        '401':
          description: Unauthorized - invalid or missing authentication token
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - UNAUTHORIZED
                        - ACCESS_DENIED
                        description: Error code for authentication or permission issues
                      details:
                        type: string
                        description: Detailed error message
        '429':
          description: Rate limited - request quota exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - RATE_LIMITED
                        description: Rate limit exceeded
                      details:
                        type: string
                        description: Rate limit error message
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                shop_ids:
                  type: string
                  description: Comma-separated list of shop IDs.
                po_numbers:
                  type: string
                  description: Filter by specific purchase order numbers (comma-separated list)
                created_at_min:
                  type: string
                  format: date-time
                  description: Minimum creation date (Y-m-d H:i:s) 24 hours format
                created_at_max:
                  type: string
                  format: date-time
                  description: Maximum creation date (Y-m-d H:i:s) 24 hours format
                limit:
                  type: integer
                  default: 10
                  description: Number of purchase orders to return per page
                cursor:
                  type: string
                  description: Cursor for pagination to retrieve the next set of results
